[project]
name = "persuadables"
version = "0.1.0"
description = "Quem deve receber a campanha? Experimento, SQL analítico e uplift na X5 RetailHero"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "scikit-uplift>=0.5.1",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "typer>=0.12",
    "rich>=13",
    "psutil>=5.9",
]

[project.optional-dependencies]
app = ["streamlit>=1.36", "altair>=5"]

[project.scripts]
persuadables = "persuadables.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "sqlfluff>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persuadables"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
