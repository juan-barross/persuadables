name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instala dependências
        run: uv sync --locked --all-extras

      - name: Lint Python
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Lint SQL
        run: uv run sqlfluff lint sql

      - name: Testes
        run: uv run pytest -q

      - name: Pipeline na amostra
        run: uv run persuadables --amostra tudo
